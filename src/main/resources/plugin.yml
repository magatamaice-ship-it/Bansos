
name: Bansos
version: '1.0.0'
main: id.server.bansos.Bansos
api-version: '1.21'
description: Lightweight player welfare reward system.

commands:
  bansos:
    description: Membuka menu dan mengklaim bansos
    usage: /bansos <claim>

  timer:
    description: Memeriksa waktu bansos
    usage: /timer bansos

permissions:
  bansos.admin:
    description: Mengelola sistem bansos
    default: op
    
